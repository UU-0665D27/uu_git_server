[package]
name = "uu_git_server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = { version = "0.16.1", features = ["full"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
base64 = "0.23.1"
bytes = "1.12.1"
gix = "0.89.0"
gix-object = "0.66.0"
gix-packetline = "0.24.0"
gix-protocol = { version = "0.67.0", features = ["handshake"] }
gix-ref = "0.69.0"
landlock = "0.4.7"
libc = "0.2.190"
rand = "0.10"
rand_core = "0.10.1"
regex = "1.13.1"
rmp-serde = "1.3.1"
russh = { version = "0.64.1", features = ["async-trait", "flate2", "ring", "rsa", "serde"], default-features = false }
#russh-keys = "0.49.2"
seccomp = "0.1.2"
seccomp-sys = "0.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["tokio"] }
#tower-http = { version = "0.7.1", features = ["fs", "limit", "trace", "util"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }


[lints.clippy]
all="deny"
pedantic="deny"
nursery="deny"
perf="deny"
